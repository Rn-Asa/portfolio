<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        ink: '#080510', // Deep elegant purple-black
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-12px)' },
                        }
                    }
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
            background-color: #080510;
        }

        .glass {
            background: rgba(139, 92, 246, 0.04); /* Subtle purple tint */
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .glass-card:hover {
            background: rgba(139, 92, 246, 0.08);
            border-color: rgba(167, 139, 250, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(139, 92, 246, 0.15);
        }

        .text-gradient {
            background: linear-gradient(135deg, #e9d5ff 0%, #c084fc 50%, #f0abfc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .repo-card.is-hidden {
            display: none;
        }
        
        /* Custom scrollbar for elegance */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #080510;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.5);
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden text-white/90 selection:bg-purple-400 selection:text-white">
    <!-- Elegant Purple Background Orbs -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-5%] w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-[120px] animate-pulse-slow"></div>
        <div class="absolute bottom-[-10%] right-[-5%] w-[600px] h-[600px] bg-fuchsia-600/10 rounded-full blur-[120px] animate-pulse-slow" style="animation-delay: 2s;"></div>
        <div class="absolute top-[40%] left-[30%] w-[300px] h-[300px] bg-indigo-500/10 rounded-full blur-[100px]"></div>
        <!-- Subtle grid overlay -->
        <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:64px_64px] opacity-40"></div>
    </div>

    <header class="sticky top-0 z-50 border-b border-white/5 bg-[#080510]/70 backdrop-blur-2xl">
        <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5 sm:px-8">
            <a href="/" class="flex items-center gap-2.5 text-[16px] font-medium tracking-wide text-white">
                <div class="flex h-8 w-8 items-center justify-center rounded-full bg-purple-500/10 border border-purple-400/20">
                    <i data-lucide="sparkles" class="h-4 w-4 text-purple-300"></i>
                </div>
                <span>{{ profile.name }}</span>
            </a>
            
            <button id="menuButton" class="rounded-full border border-white/10 px-4 py-2 text-sm text-white/70 transition hover:bg-white/5 sm:hidden" type="button" aria-expanded="false" aria-controls="mobileMenu">
                Menu
            </button>
            
            <div class="hidden items-center gap-1 text-sm font-medium text-white/60 sm:flex">
                {% for item in nav_items %}
                    <a class="rounded-full px-4 py-2 transition-all duration-300 hover:text-white {% if active_nav == item.label %}text-purple-300 bg-purple-500/10{% else %}hover:bg-white/5{% endif %}" href="{{ item.href }}">
                        {{ item.label }}
                    </a>
                {% endfor %}
            </div>
        </nav>
        
        <!-- Mobile Menu -->
        <div id="mobileMenu" class="hidden border-t border-white/5 bg-[#080510]/95 px-6 pb-6 pt-4 text-sm sm:hidden backdrop-blur-xl">
            <div class="flex flex-col gap-2">
                {% for item in nav_items %}
                    <a class="flex items-center gap-3 rounded-xl px-4 py-3 transition hover:bg-purple-500/10 hover:text-purple-300" href="{{ item.href }}">
                        <i data-lucide="{{ item.icon }}" class="h-4 w-4"></i>
                        {{ item.label }}
                    </a>
                {% endfor %}
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="mt-20 border-t border-white/5 px-6 py-10 text-center text-sm text-white/40 sm:px-8">
        <p>Designed & Built with care by {{ profile.name }} &copy; 2026</p>
    </footer>

    <script>
        const menuButton = document.getElementById('menuButton');
        const mobileMenu = document.getElementById('mobileMenu');

        if (menuButton && mobileMenu) {
            menuButton.addEventListener('click', () => {
                const isOpen = mobileMenu.classList.toggle('hidden') === false;
                menuButton.setAttribute('aria-expanded', String(isOpen));
                menuButton.textContent = isOpen ? 'Close' : 'Menu';
            });

            document.querySelectorAll('#mobileMenu a').forEach((link) => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.add('hidden');
                    menuButton.setAttribute('aria-expanded', 'false');
                    menuButton.textContent = 'Menu';
                });
            });
        }
        
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>

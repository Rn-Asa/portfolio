<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        ink: '#050507',
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.075);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
        }

        .project-card,
        .repo-card {
            transform: translateY(0);
            transition: transform 220ms ease, border-color 220ms ease, background 220ms ease, opacity 180ms ease;
        }

        .project-card:hover,
        .repo-card:hover {
            transform: translateY(-5px);
            border-color: rgba(147, 197, 253, 0.65);
            background: rgba(255, 255, 255, 0.11);
        }

        .project-card.is-active {
            border-color: rgba(96, 165, 250, 0.75);
            background: rgba(37, 99, 235, 0.18);
        }

        .repo-card.is-hidden {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden bg-ink text-white selection:bg-blue-400 selection:text-white">
    <div class="fixed inset-0 -z-10">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_20%_15%,rgba(59,130,246,0.28),transparent_30%),radial-gradient(circle_at_80%_10%,rgba(20,184,166,0.16),transparent_26%),linear-gradient(180deg,#050507_0%,#0b0d12_48%,#050507_100%)]"></div>
        <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.035)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.035)_1px,transparent_1px)] bg-[size:72px_72px] opacity-30"></div>
    </div>

    <header class="sticky top-0 z-50 border-b border-white/10 bg-black/45 backdrop-blur-2xl">
        <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4 sm:px-8">
            <a href="/" class="flex items-center gap-2 text-[15px] font-semibold text-white">
                <i data-lucide="sparkles" class="h-4 w-4 text-blue-300"></i>
                {{ profile.name }}
            </a>
            <button id="menuButton" class="rounded-full border border-white/15 px-3 py-2 text-sm text-white/80 sm:hidden" type="button" aria-expanded="false" aria-controls="mobileMenu">
                Menu
            </button>
            <div class="hidden items-center gap-2 text-sm text-white/70 sm:flex">
                {% for item in nav_items %}
                    <a class="rounded-full border p-3 transition hover:border-white/30 hover:bg-white/10 hover:text-white {% if active_nav == item.label %}border-blue-300/40 bg-blue-400/10 text-blue-200{% else %}border-white/10 text-white/70{% endif %}" href="{{ item.href }}" aria-label="{{ item.label }}">
                        <i data-lucide="{{ item.icon }}" class="h-4 w-4"></i>
                        <span class="sr-only">{{ item.label }}</span>
                    </a>
                {% endfor %}
            </div>
        </nav>
        <div id="mobileMenu" class="hidden border-t border-white/10 px-5 pb-4 text-sm text-white/75 sm:hidden">
            <div class="flex flex-col gap-3 pt-3">
                {% for item in nav_items %}
                    <a class="flex items-center gap-3" href="{{ item.href }}">
                        <i data-lucide="{{ item.icon }}" class="h-4 w-4"></i>
                        {{ item.label }}
                    </a>
                {% endfor %}
            </div>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer class="px-5 py-8 text-center text-sm text-white/38 sm:px-8">
        <p>&copy; 2026 {{ profile.name }}. All rights reserved.</p>
    </footer>

    <script>
        const menuButton = document.getElementById('menuButton');
        const mobileMenu = document.getElementById('mobileMenu');

        if (menuButton && mobileMenu) {
            menuButton.addEventListener('click', () => {
                const isOpen = mobileMenu.classList.toggle('hidden') === false;
                menuButton.setAttribute('aria-expanded', String(isOpen));
                menuButton.textContent = isOpen ? 'Close' : 'Menu';
            });

            document.querySelectorAll('#mobileMenu a').forEach((link) => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.add('hidden');
                    menuButton.setAttribute('aria-expanded', 'false');
                    menuButton.textContent = 'Menu';
                });
            });
        }
    </script>
    {% block scripts %}{% endblock %}
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>
</html>
